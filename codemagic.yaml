workflows:
  ios-capacitor:
    name: iOS Capacitor Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies & Build Web
        script: |
          npm ci || npm install
          npm run build
      - name: Capacitor Sync iOS
        script: |
          npx cap sync ios
      - name: Build iOS App
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" COMPILER_INDEX_STORE_ENABLE=NO build
      - name: Create IPA Package
        script: |
          cd ios/App
          mkdir -p Payload
          find . -name "App.app" -type d -exec cp -r {} Payload/ \;
          zip -r TekApp-iOS-Unsigned.ipa Payload
    artifacts:
      - ios/App/TekApp-iOS-Unsigned.ipa
      - ios/App/build/**/*.app
      - /Users/builder/clone/ios/App/**/*.ipa
