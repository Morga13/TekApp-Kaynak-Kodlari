name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Fix Package.swift Paths
        run: node -e "const fs=require('fs'); const p='ios/App/CapApp-SPM/Package.swift'; if(fs.existsSync(p)){ fs.writeFileSync(p, fs.readFileSync(p,'utf8').replace(/\\\\/g, '/')); }"

      - name: Copy Capacitor Web Assets
        run: npx cap copy ios

      - name: Build iOS App
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products -name "App.app" | head -n 1)
          echo "Found App bundle at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r TekApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TekApp-iOS-IPA
          path: TekApp.ipa
          retention-days: 30
